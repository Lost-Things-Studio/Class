name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lua:
    name: Lua ${{ matrix.lua-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lua-version:
          - "5.1"
          - "5.2"
          - "5.3"
          - "5.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Check syntax
        run: luac -p class.lua tests/*.lua

      - name: Run unit tests
        run: lua tests/run.lua
